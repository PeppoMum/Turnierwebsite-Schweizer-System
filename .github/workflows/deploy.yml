name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Echte Datenhaltung im Firebase-Projekt turnierwebsite-swiss-system (Webkonfiguration ist kein Geheimnis,
          # der Schutz kommt aus firestore.rules). Repository-Variablen gleichen Namens überschreiben die Werte;
          # VITE_DATA_SOURCE=mock schaltet zurück auf Beispieldaten.
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'firebase' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyD5AYhlprkLCGcTeYtOVEk0dxJo_4SBT3A' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'turnierwebsite-swiss-system.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'turnierwebsite-swiss-system' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'turnierwebsite-swiss-system.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '513790803137' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:513790803137:web:0eccb302986ad960f96840' }}
          VITE_USE_FIREBASE_EMULATOR: 'false'
      # SPA-Fallback: Deep Links landen auf 404.html und laden dieselbe App (Routing über den Hash).
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
